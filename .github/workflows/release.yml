name: Release

# On a version tag: test, build the .deb from a clean checkout and attach it
# to the GitHub release (created from the CHANGELOG section if missing).
# Signing and publishing the apt repository stays on the maintainer's machine.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav xvfb xauth ffmpeg unzip python3-mutagen
      - name: Tests
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests
      - name: Check the tag matches APP_VERSION
        run: |
          version=$(python3 -c "import re; print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('llamaamp/constants.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != APP_VERSION $version"; exit 1; }
      - name: Build the .deb
        run: ./packaging/build-deb.sh
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          deb=packaging/dist/llama-amp_${version}_all.deb
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$deb" --clobber
          else
            awk "/^## ${version}( |$)/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notes.md
            gh release create "$GITHUB_REF_NAME" "$deb" --title "Llama Amp $version" --notes-file notes.md
          fi
