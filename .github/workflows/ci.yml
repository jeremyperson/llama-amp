name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m py_compile musicPlayer.py
      - name: Byte-compile packaging scripts
        run: bash -n packaging/build-deb.sh
