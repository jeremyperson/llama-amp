name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m compileall -q musicPlayer.py llamaamp
      - name: Byte-compile packaging scripts
        run: bash -n packaging/build-deb.sh
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav xvfb xauth ffmpeg
      - name: Behavioral and GTK integration tests
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
