app-id: com.jeremyperson.LlamaAmp
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: llama-amp
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  # ALSA direct output needs raw device access
  - --device=all
  # Music libraries commonly live on mounted drives
  - --filesystem=xdg-music
  - --filesystem=/media
  - --filesystem=host:ro
  # MPRIS media keys / desktop integration
  - --own-name=org.mpris.MediaPlayer2.llamaamp
modules:
  - name: llama-amp
    buildsystem: simple
    build-commands:
      - install -Dm644 musicPlayer.py /app/share/llama-amp/musicPlayer.py
      - install -Dm755 llama-amp.sh /app/bin/llama-amp
      - install -Dm644 musicPlayer.svg /app/share/icons/hicolor/scalable/apps/com.jeremyperson.LlamaAmp.svg
      - install -Dm644 com.jeremyperson.LlamaAmp.desktop /app/share/applications/com.jeremyperson.LlamaAmp.desktop
      - install -Dm644 fonts/DSEG7Classic-Regular.ttf /app/share/fonts/DSEG7Classic-Regular.ttf
      - install -Dm644 fonts/DSEG7Classic-Bold.ttf /app/share/fonts/DSEG7Classic-Bold.ttf
      - install -Dm644 "fonts/Orbitron[wght].ttf" "/app/share/fonts/Orbitron[wght].ttf"
      - install -Dm644 fonts/DSEG-LICENSE.txt /app/share/doc/llama-amp/DSEG-LICENSE.txt
      - install -Dm644 fonts/OFL.txt /app/share/doc/llama-amp/Orbitron-OFL.txt
    sources:
      - type: dir
        path: flatpak-src
